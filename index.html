<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manifestation Meditation</title>
  <style>
    :root {
      --ink: #050807;
      --mist: #fff7dd;
      --gold: #f0c56b;
      --aqua: #8edfcf;
      --rose: #e4a08f;
      --chakra-hue: 0;
      --phase-hue: 42;
      --breath-scale: 0.78;
      --breath-progress: 0deg;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--ink);
    }

    body {
      overflow: hidden;
      color: var(--mist);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      letter-spacing: 0;
    }

    .scene {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background:
        linear-gradient(140deg, rgba(7, 17, 14, 0.96), rgba(20, 69, 58, 0.9) 35%, rgba(88, 54, 66, 0.82) 68%, rgba(177, 116, 66, 0.86)),
        linear-gradient(35deg, #050807, #14382f 46%, #e0b767 142%);
      background-size: 170% 170%, 210% 210%;
      animation: fieldDrift 58s ease-in-out infinite alternate;
    }

    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(5, 8, 7, 0.42), transparent 22%, transparent 78%, rgba(5, 8, 7, 0.34)),
        linear-gradient(180deg, rgba(255, 247, 221, 0.09), transparent 42%, rgba(5, 8, 7, 0.46));
    }

    #geometry,
    #garden {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #geometry {
      z-index: 2;
      opacity: 0.9;
      mix-blend-mode: screen;
    }

    #garden {
      z-index: 5;
      opacity: 0.92;
    }

    .colour-tide,
    .axis-light,
    .soft-rays {
      position: fixed;
      pointer-events: none;
    }

    .colour-tide {
      inset: -18vmax;
      z-index: 1;
      opacity: 0.44;
      background:
        conic-gradient(
          from 0deg at 50% 48%,
          rgba(10, 28, 24, 0.94) 0deg,
          rgba(32, 102, 83, 0.9) 60deg,
          rgba(84, 73, 140, 0.74) 126deg,
          rgba(190, 78, 98, 0.68) 186deg,
          rgba(223, 157, 67, 0.84) 248deg,
          rgba(124, 195, 169, 0.78) 310deg,
          rgba(10, 28, 24, 0.94) 360deg
        );
      filter: blur(34px) saturate(1.35);
      mix-blend-mode: screen;
      transform-origin: center;
      animation: tideTurn 46s ease-in-out infinite alternate;
    }

    .axis-light {
      top: 5%;
      bottom: 6%;
      left: 50%;
      z-index: 3;
      width: min(38rem, 70vw);
      translate: -50% 0;
      opacity: 0.66;
      background:
        radial-gradient(ellipse at 50% 50%, rgba(255, 247, 221, 0.34), rgba(240, 197, 107, 0.15) 22%, rgba(142, 223, 207, 0.08) 40%, rgba(255, 247, 221, 0) 66%),
        linear-gradient(90deg, transparent, rgba(255, 247, 221, 0.13) 49%, rgba(255, 247, 221, 0.13) 51%, transparent);
      filter: blur(10px);
      mix-blend-mode: screen;
      animation: axisBreathe 12s ease-in-out infinite;
    }

    .soft-rays {
      inset: -18vmin;
      z-index: 3;
      opacity: 0.18;
      background:
        repeating-linear-gradient(
          118deg,
          rgba(255, 247, 221, 0) 0,
          rgba(255, 247, 221, 0) 5.8rem,
          rgba(255, 247, 221, 0.1) 6.15rem,
          rgba(255, 247, 221, 0) 6.75rem
        );
      transform: rotate(-4deg);
      animation: rayDrift 30s ease-in-out infinite alternate;
    }

    .mantra,
    .focus {
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .mantra {
      position: fixed;
      top: clamp(1.2rem, 6svh, 3.5rem);
      left: 50%;
      z-index: 7;
      width: min(62rem, calc(100vw - 3rem));
      translate: -50% 0;
      text-align: center;
      pointer-events: none;
    }

    h1 {
      margin: 0;
      color: var(--mist);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-size: 5.1rem;
      line-height: 0.98;
      font-weight: 500;
      text-wrap: balance;
      text-shadow:
        0 0 1rem rgba(240, 197, 107, 0.36),
        0 1.2rem 4rem rgba(5, 8, 7, 0.66);
      transition: opacity 1.1s ease, transform 1.1s ease, font-size 250ms ease;
    }

    .mantra.compact h1 {
      font-size: 4.25rem;
      line-height: 1;
    }

    .mantra.fade-out h1 {
      opacity: 0;
      transform: translateY(0.5rem);
    }

    .focus {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 8;
      width: min(16.5rem, 38vmin);
      aspect-ratio: 1;
      translate: -50% -50%;
      display: grid;
      place-items: center;
      color: rgba(255, 247, 221, 0.9);
      pointer-events: none;
    }

    .focus::before,
    .focus::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .focus::before {
      inset: -6%;
      opacity: 0.64;
      background:
        conic-gradient(
          from -90deg,
          hsla(var(--chakra-hue), 88%, 66%, 0.68) 0deg 106deg,
          rgba(255, 247, 221, 0.28) 106deg 158deg,
          hsla(var(--chakra-hue), 72%, 76%, 0.44) 158deg 306deg,
          rgba(228, 160, 143, 0.34) 306deg 360deg
        );
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
      filter: drop-shadow(0 0 0.85rem hsla(var(--phase-hue), 88%, 68%, 0.42));
      animation: ringTurn 42s linear infinite;
    }

    .focus::after {
      inset: -12%;
      opacity: 0.94;
      background:
        conic-gradient(
          from -90deg,
          hsla(var(--phase-hue), 90%, 72%, 0.94) 0deg,
          hsla(var(--phase-hue), 90%, 72%, 0.94) var(--breath-progress),
          rgba(255, 247, 221, 0.1) var(--breath-progress),
          rgba(255, 247, 221, 0.1) 360deg
        );
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 2px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 2px));
      filter: drop-shadow(0 0 1rem hsla(var(--phase-hue), 88%, 70%, 0.55));
      transition: background 250ms linear, filter 700ms ease;
    }

    .focus-halo,
    .focus-orbit,
    .focus-pulse {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .focus-halo {
      inset: 0;
      border: 1px solid rgba(255, 247, 221, 0.22);
      box-shadow:
        0 0 3.4rem rgba(240, 197, 107, 0.2),
        inset 0 0 2.6rem rgba(142, 223, 207, 0.12);
    }

    .focus-orbit {
      inset: 10%;
      border: 1px dashed rgba(255, 247, 221, 0.25);
      animation: ringTurn 32s linear infinite reverse;
    }

    .focus-pulse {
      inset: 21%;
      opacity: 0.92;
      background:
        radial-gradient(circle, rgba(255, 247, 221, 0.42), hsla(var(--chakra-hue), 84%, 66%, 0.3) 38%, hsla(var(--phase-hue), 72%, 72%, 0.12) 62%, transparent 72%);
      filter: blur(1px);
      transform: scale(var(--breath-scale));
      transition: transform 650ms ease, background 900ms ease;
    }

    .focus-text {
      position: relative;
      z-index: 1;
      display: grid;
      justify-items: center;
      gap: 0.24rem;
      text-align: center;
      text-shadow: 0 0 1.3rem rgba(5, 8, 7, 0.74);
    }

    .phase {
      color: hsla(var(--phase-hue), 88%, 76%, 0.98);
      font-size: 0.92rem;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .count {
      margin-top: 0.1rem;
      color: rgba(255, 247, 221, 0.84);
      font-size: 1.08rem;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .audio-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 14;
      display: grid;
      place-items: center;
      inline-size: 2.9rem;
      block-size: 2.9rem;
      border: 1px solid rgba(255, 247, 221, 0.16);
      border-radius: 50%;
      color: rgba(255, 247, 221, 0.82);
      background: rgba(5, 8, 7, 0.5);
      box-shadow: 0 0.8rem 2rem rgba(0, 0, 0, 0.22), inset 0 0 1.2rem rgba(255, 247, 221, 0.04);
      backdrop-filter: blur(12px);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .speaker-icon {
      position: relative;
      inline-size: 1rem;
      block-size: 1rem;
    }

    .speaker-icon::before {
      content: "";
      position: absolute;
      left: 0.04rem;
      top: 0.28rem;
      inline-size: 0.34rem;
      block-size: 0.44rem;
      border-radius: 2px;
      background: currentColor;
    }

    .speaker-icon::after {
      content: "";
      position: absolute;
      left: 0.25rem;
      top: 0.14rem;
      border-top: 0.36rem solid transparent;
      border-bottom: 0.36rem solid transparent;
      border-right: 0.54rem solid currentColor;
    }

    .audio-toggle[data-audio="on"] {
      color: rgba(184, 255, 212, 0.95);
      border-color: rgba(184, 255, 212, 0.34);
      box-shadow: 0 0.8rem 2rem rgba(0, 0, 0, 0.22), 0 0 1.4rem rgba(104, 255, 178, 0.22);
    }

    .audio-toggle[data-audio="off"] .speaker-icon {
      opacity: 0.58;
    }

    .audio-toggle[data-audio="off"] .speaker-icon span {
      position: absolute;
      left: 0.12rem;
      top: 0.47rem;
      inline-size: 1rem;
      block-size: 2px;
      border-radius: 999px;
      background: currentColor;
      transform: rotate(-42deg);
      transform-origin: center;
    }

    .icon-sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .symbol-icon {
      inline-size: 1.02rem;
      block-size: 1.02rem;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .audio-toggle .symbol-icon {
      inline-size: 1.18rem;
      block-size: 1.18rem;
    }

    .audio-toggle[data-audio="off"] .symbol-icon {
      opacity: 0.62;
    }

    .audio-toggle[data-audio="off"]::after {
      content: "";
      position: absolute;
      inline-size: 1.24rem;
      block-size: 2px;
      border-radius: 999px;
      background: currentColor;
      transform: rotate(-42deg);
      opacity: 0.86;
    }

    .audio-debug {
      position: fixed;
      left: 0.75rem;
      top: 0.75rem;
      z-index: 30;
      display: none;
      max-width: min(19rem, calc(100vw - 4.5rem));
      padding: 0.55rem 0.65rem;
      border: 1px solid rgba(184, 255, 212, 0.22);
      border-radius: 8px;
      color: rgba(226, 255, 238, 0.92);
      background: rgba(5, 8, 7, 0.66);
      box-shadow: 0 0.8rem 2rem rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(12px);
      font: 0.68rem/1.45 "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
      white-space: pre-line;
      pointer-events: none;
    }

    html[data-audio-debug="true"] .audio-debug {
      display: block;
    }

    .chakra-panel {
      position: fixed;
      left: 1rem;
      bottom: 1rem;
      z-index: 10;
      width: min(21rem, calc(100vw - 2rem));
      padding: 0.8rem;
      border: 1px solid rgba(255, 247, 221, 0.16);
      border-radius: 8px;
      color: rgba(255, 247, 221, 0.9);
      background: rgba(5, 8, 7, 0.58);
      box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.28), inset 0 0 2rem rgba(255, 247, 221, 0.04);
      backdrop-filter: blur(14px);
      font-family: "Segoe UI", Arial, sans-serif;
      touch-action: pan-y;
      transition: width 300ms ease, padding 300ms ease, background 300ms ease, box-shadow 300ms ease;
    }

    .side-panel {
      top: 50%;
      bottom: auto;
      width: min(18.2rem, calc(100vw - 2rem));
      transform: translateY(-50%);
      --panel-hue: 154;
    }

    .gratitude-panel {
      left: 1rem;
    }

    .breath-panel {
      left: auto;
      right: 1rem;
      --panel-hue: 178;
    }

    .chakra-panel[data-collapsed="true"] {
      width: min(14.8rem, calc(100vw - 2rem));
      padding: 0.56rem 0.64rem;
      background: rgba(5, 8, 7, 0.5);
      box-shadow: 0 0.8rem 2.2rem rgba(0, 0, 0, 0.24), inset 0 0 1.4rem rgba(255, 247, 221, 0.04);
    }

    .chakra-panel[data-collapsed="true"] .chakra-body {
      display: none;
    }

    .chakra-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.8rem;
      margin-bottom: 0.65rem;
    }

    .chakra-panel[data-collapsed="true"] .chakra-head {
      align-items: center;
      margin-bottom: 0;
    }

    .chakra-head-actions {
      display: flex;
      align-items: center;
      gap: 0.38rem;
    }

    .chakra-name {
      display: flex;
      align-items: center;
      gap: 0.42rem;
      margin-top: 0.1rem;
      color: hsl(var(--panel-hue, var(--chakra-hue)), 88%, 74%);
      font-size: 1rem;
      line-height: 1.2;
      font-weight: 700;
    }

    .chakra-frequency {
      min-width: 4.7rem;
      color: rgba(255, 247, 221, 0.82);
      font-size: 0.9rem;
      line-height: 1.3;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .panel-toggle {
      display: grid;
      place-items: center;
      inline-size: 2rem;
      block-size: 2rem;
      border: 1px solid rgba(255, 247, 221, 0.16);
      border-radius: 50%;
      background: rgba(255, 247, 221, 0.08);
      color: rgba(255, 247, 221, 0.82);
      cursor: pointer;
    }

    .panel-toggle::before {
      content: "";
      inline-size: 0.46rem;
      block-size: 0.46rem;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg) translate(-1px, -1px);
    }

    .chakra-panel[data-collapsed="true"] .panel-toggle::before {
      transform: rotate(225deg) translate(-1px, -1px);
    }

    .chakra-body {
      display: grid;
    }

    .gratitude-line {
      margin: 0 0 0.7rem;
      color: rgba(255, 247, 221, 0.82);
      font-size: 0.84rem;
      line-height: 1.35;
    }

    .soft-actions,
    .link-stack {
      display: grid;
      gap: 0.42rem;
    }

    .soft-actions {
      grid-template-columns: 1fr 1fr;
      margin-bottom: 0.64rem;
    }

    .soft-command,
    .support-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.38rem;
      min-height: 2.15rem;
      border: 1px solid rgba(255, 247, 221, 0.14);
      border-radius: 8px;
      color: rgba(255, 247, 221, 0.86);
      background: rgba(255, 247, 221, 0.07);
      font: 700 0.78rem/1 "Segoe UI", Arial, sans-serif;
      text-decoration: none;
      cursor: pointer;
    }

    .support-link {
      justify-content: space-between;
      padding: 0 0.64rem;
    }

    .support-link > span {
      display: flex;
      align-items: center;
      gap: 0.38rem;
    }

    .soft-command:hover,
    .support-link:hover {
      background: rgba(255, 247, 221, 0.12);
    }

    .support-link[aria-disabled="true"] {
      opacity: 0.56;
      cursor: default;
      pointer-events: none;
    }

    .breath-controls {
      display: grid;
      gap: 0.52rem;
    }

    .breath-controls .chakra-row {
      margin-top: 0;
    }

    .breath-reset {
      margin-top: 0.1rem;
    }

    .chakra-buttons {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.36rem;
      margin-bottom: 0.72rem;
    }

    .chakra-button {
      width: 100%;
      aspect-ratio: 1;
      border: 1px solid rgba(255, 247, 221, 0.2);
      border-radius: 50%;
      background: hsl(var(--swatch-hue), 84%, 58%);
      box-shadow: 0 0 1rem hsla(var(--swatch-hue), 86%, 62%, 0.2);
      cursor: pointer;
    }

    .chakra-button[aria-pressed="true"] {
      border-color: rgba(255, 247, 221, 0.86);
      box-shadow:
        0 0 0 2px rgba(5, 8, 7, 0.72),
        0 0 1.2rem hsla(var(--swatch-hue), 88%, 70%, 0.72);
    }

    .chakra-row {
      display: grid;
      gap: 0.34rem;
      margin-top: 0.56rem;
    }

    .control-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
    }

    .auto-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      color: rgba(255, 247, 221, 0.78);
      font-size: 0.82rem;
      line-height: 1.2;
    }

    .auto-label input {
      inline-size: 1.15rem;
      block-size: 1.15rem;
      accent-color: hsl(var(--chakra-hue), 88%, 62%);
    }

    .range-field {
      display: grid;
      gap: 0.32rem;
    }

    .range-field input[type="range"] {
      width: 100%;
      accent-color: hsl(var(--chakra-hue), 88%, 62%);
    }

    .range-value {
      color: rgba(255, 247, 221, 0.76);
      font-size: 0.76rem;
      font-variant-numeric: tabular-nums;
    }

    @keyframes fieldDrift {
      0% {
        background-position: 0% 52%, 48% 22%;
      }
      35% {
        background-position: 66% 38%, 24% 78%;
      }
      72% {
        background-position: 36% 84%, 88% 44%;
      }
      100% {
        background-position: 100% 48%, 42% 16%;
      }
    }

    @keyframes tideTurn {
      0% {
        opacity: 0.36;
        transform: rotate(0deg) scale(1);
      }
      42% {
        opacity: 0.58;
        transform: rotate(36deg) scale(1.08);
      }
      100% {
        opacity: 0.5;
        transform: rotate(-28deg) scale(1.12);
      }
    }

    @keyframes axisBreathe {
      0%,
      100% {
        opacity: 0.46;
        transform: scaleY(0.94);
      }
      50% {
        opacity: 0.76;
        transform: scaleY(1.04);
      }
    }

    @keyframes rayDrift {
      from {
        translate: -1.8rem -0.8rem;
      }
      to {
        translate: 1.6rem 1.1rem;
      }
    }

    @keyframes ringTurn {
      from {
        rotate: 0deg;
      }
      to {
        rotate: 360deg;
      }
    }

    @media (max-width: 760px) {
      .audio-toggle {
        top: 0.75rem;
        right: 0.75rem;
        inline-size: 2.7rem;
        block-size: 2.7rem;
      }

      .mantra {
        top: 2rem;
        width: min(28rem, calc(100vw - 2rem));
      }

      h1,
      .mantra.compact h1 {
        font-size: 2.65rem;
        line-height: 1;
      }

      .focus {
        width: min(12.8rem, 54vmin);
      }

      .chakra-panel:not(.side-panel) {
        left: 50%;
        right: auto;
        bottom: 0.75rem;
        width: min(22rem, calc(100vw - 1.5rem));
        padding: 0.68rem;
        max-height: calc(100svh - 1.5rem);
        overflow: hidden;
        transform: translateX(-50%);
      }

      .chakra-panel:not(.side-panel)[data-collapsed="true"] {
        width: min(14.8rem, calc(100vw - 1.5rem));
        padding: 0.52rem 0.62rem;
      }

      .side-panel {
        top: auto;
        bottom: 4.5rem;
        padding: 0.56rem 0.62rem;
        transform: none;
      }

      .side-panel[data-collapsed="true"] {
        width: min(10.5rem, calc(50vw - 1rem));
      }

      .gratitude-panel {
        left: 0.75rem;
      }

      .breath-panel {
        right: 0.75rem;
      }

      .side-panel[data-collapsed="false"] {
        left: 50%;
        right: auto;
        bottom: 4.5rem;
        z-index: 12;
        width: min(22rem, calc(100vw - 1.5rem));
        padding: 0.68rem;
        transform: translateX(-50%);
      }

      .chakra-buttons {
        gap: 0.3rem;
        margin-bottom: 0.58rem;
      }

      .chakra-row {
        margin-top: 0.48rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="A quiet manifestation meditation page">
    <canvas id="geometry" aria-hidden="true"></canvas>
    <canvas id="garden" aria-hidden="true"></canvas>
    <div class="colour-tide" aria-hidden="true"></div>
    <div class="axis-light" aria-hidden="true"></div>
    <div class="soft-rays" aria-hidden="true"></div>

    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-heart" viewBox="0 0 24 24">
        <path d="M12 20s-7-4.4-8.7-9.2C2 7.1 4.4 4.5 7.2 4.5c1.7 0 3.1 1 4.8 2.9 1.7-1.9 3.1-2.9 4.8-2.9 2.8 0 5.2 2.6 3.9 6.3C19 15.6 12 20 12 20Z"></path>
      </symbol>
      <symbol id="icon-seed" viewBox="0 0 24 24">

        "I am allowed to be transformed.",
        "The answer can be simple.",
        "My spirit knows the way home.",

        "I receive, then I become responsible.",
        "I am becoming ready.",
        "I am connected.",
        "The blessing is not separate from my healing."

      const GRATITUDE_LINES = [
        "Thank you for the guidance already here.",

        "Thank you for what is healing in silence.",

      const GREEN_TEA_URL = "";

      const PLANT_INTERVAL_MS = 72000;
      const mobileControls = window.matchMedia("(max-width: 760px)");
      const query = new URLSearchParams(window.location.search);
      const forceMediaAudio = query.has("force-media-audio");
      const audioDebugEnabled = query.has("audio-debug");
      const mobileUserAgent = /Android|iPhone|iPad|iPod|Mobile|CriOS|FxiOS/i.test(navigator.userAgent);
      const touchConstrainedAudio = window.matchMedia("(pointer: coarse)").matches || (/Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
      const hasWebAudio = Boolean(window.AudioContext || window.webkitAudioContext);
      const MEDIA_BASE_FREQUENCY = 432;
      const PLANT_KINDS = [
        { kind: "flower", matureMs: 38 * 60 * 1000, weight: 5 },
        { kind: "tree", matureMs: 150 * 60 * 1000, weight: 1 }
      ];

      const state = {
        width: 0,
        height: 0,
        dpr: 1,
        mantraIndex: 0,
        activeBreath: -1,
        breathStart: performance.now(),
        chakraIndex: 0,
        chakraAuto: true,
        chakraLastAdvance: performance.now(),
        chakraAutoMs: 32000,
        frequency: CHAKRAS[0].frequency,
        volume: 0.52,
        audio: null,
        audioEnabled: false,
        audioSettled: false,
        mediaFallbackAudible: false,
        mediaAudio: null,
        mediaAudioUrl: "",
        mediaFrequency: 0,
        isMobileAudio: mobileUserAgent || touchConstrainedAudio,
        lastAudioGesture: "none",
        gratitudeIndex: 0,
        panelCollapsed: mobileControls.matches,
        panelUserSet: false,
        panelGesture: null,
        sidePanelCollapsed: {
          gratitude: true,
          breath: true
        },
        garden: {
          plants: [],
          lastTick: performance.now(),
          lastSave: 0,
          plantCount: 0,
          bee: {
            x: 0,
            y: 0,
            targetX: 0,
            targetY: 0,
            vx: 0,
            vy: 0,
            direction: 1,
            action: "scout",
            actionUntil: performance.now() + 3200,
            nextPlantAt: performance.now() + 7400,
            pollen: 0,
            stepSeed: Math.random() * Math.PI * 2,
            wingSeed: Math.random() * Math.PI * 2
          }
        }
      };

      let breathTotal = BREATH.reduce((sum, phase) => sum + phase.ms, 0);

      function resize() {
        state.dpr = Math.min(window.devicePixelRatio || 1, 2);
        state.width = window.innerWidth;
        state.height = window.innerHeight;
        canvas.width = Math.floor(state.width * state.dpr);
        canvas.height = Math.floor(state.height * state.dpr);
        canvas.style.width = `${state.width}px`;
        canvas.style.height = `${state.height}px`;
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
        gardenCanvas.width = Math.floor(state.width * state.dpr);
        gardenCanvas.height = Math.floor(state.height * state.dpr);
        gardenCanvas.style.width = `${state.width}px`;
        gardenCanvas.style.height = `${state.height}px`;
        gardenCtx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
        if (!state.panelUserSet) {
          state.panelCollapsed = mobileControls.matches;
        }
        syncPanelUi();
        syncSidePanels();
        if (!state.garden.bee.x || !state.garden.bee.y) {
          placeBee();
        }
        window.setTimeout(fitMantra, 0);
      }

      function fitMantra() {
        els.mantra.classList.remove("compact");
        const textBox = els.mantra.getBoundingClientRect();
        const focusBox = document.querySelector(".focus").getBoundingClientRect();
        if (textBox.bottom > focusBox.top - 24) {
          els.mantra.classList.add("compact");
        }
      }

      function setMantra(index) {
        els.line.textContent = MANTRAS[index];
        fitMantra();
      }

      function syncPanelUi() {
        els.chakraPanel.dataset.collapsed = String(state.panelCollapsed);
        els.panelToggle.setAttribute("aria-expanded", String(!state.panelCollapsed));
        els.panelToggle.setAttribute("aria-label", state.panelCollapsed ? "Expand controls" : "Minimize controls");
        els.panelToggle.title = state.panelCollapsed ? "Expand controls" : "Minimize controls";
      }

      function setPanelCollapsed(collapsed, userSet = true) {
        state.panelCollapsed = collapsed;
        if (userSet) {
          state.panelUserSet = true;
        }
        syncPanelUi();
      }

      function syncSidePanels() {
        const panels = [
          { name: "gratitude", panel: els.gratitudePanel, toggle: els.gratitudeToggle },
          { name: "breath", panel: els.breathPanel, toggle: els.breathToggle }
        ];

        panels.forEach(({ name, panel, toggle }) => {
          const collapsed = state.sidePanelCollapsed[name];
          panel.dataset.collapsed = String(collapsed);
          toggle.setAttribute("aria-expanded", String(!collapsed));
          toggle.setAttribute("aria-label", collapsed ? `Expand ${name} controls` : `Minimize ${name} controls`);
          toggle.title = collapsed ? `Expand ${name} controls` : `Minimize ${name} controls`;
        });
      }

      function setSidePanelCollapsed(name, collapsed) {
        if (!collapsed) {
          Object.keys(state.sidePanelCollapsed).forEach((panelName) => {
            state.sidePanelCollapsed[panelName] = panelName === name ? false : true;
          });
        } else {
          state.sidePanelCollapsed[name] = true;
        }
        syncSidePanels();
      }

      function formatFrequency(value) {
        return `${Math.round(value)} Hz`;
      }

      function formatSeconds(ms) {
        const seconds = ms / 1000;
        return `${Number.isInteger(seconds) ? seconds.toFixed(0) : seconds.toFixed(1)}s`;
      }

      function syncBreathControls() {
        BREATH.forEach((phase, index) => {
          els.breathRanges[index].value = phase.ms / 1000;
          els.breathOutputs[index].textContent = formatSeconds(phase.ms);
        });
      }

      function setBreathDuration(index, seconds) {
        BREATH[index].ms = Math.round(Number(seconds) * 1000);
        breathTotal = BREATH.reduce((sum, phase) => sum + phase.ms, 0);
        state.activeBreath = -1;
        state.breathStart = performance.now();
        syncBreathControls();
      }

      function resetBreathDurations() {
        DEFAULT_BREATH_MS.forEach((ms, index) => {
          BREATH[index].ms = ms;
        });
        breathTotal = BREATH.reduce((sum, phase) => sum + phase.ms, 0);
        state.activeBreath = -1;
        state.breathStart = performance.now();
        syncBreathControls();
      }

      function setGratitude(index) {
        state.gratitudeIndex = (index + GRATITUDE_LINES.length) % GRATITUDE_LINES.length;
        els.gratitudeLine.textContent = GRATITUDE_LINES[state.gratitudeIndex];
      }

      function buildChakraButtons() {
        CHAKRAS.forEach((chakra, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "chakra-button";
          button.dataset.index = index;
          button.style.setProperty("--swatch-hue", chakra.hue);
          button.setAttribute("aria-label", `${chakra.name} chakra, ${chakra.frequency} Hz`);
          button.setAttribute("aria-pressed", index === state.chakraIndex ? "true" : "false");
          button.title = `${chakra.name} - ${chakra.frequency} Hz`;
          els.chakraButtons.appendChild(button);
        });
      }

      function syncChakraUi() {
        const chakra = CHAKRAS[state.chakraIndex];
        document.documentElement.style.setProperty("--chakra-hue", chakra.hue);
        els.chakraName.textContent = chakra.name;
        els.chakraFrequency.textContent = formatFrequency(state.frequency);
        els.frequencyValue.textContent = formatFrequency(state.frequency);
        els.frequencyRange.value = Math.round(state.frequency);
        els.volumeValue.textContent = `${Math.round(state.volume * 100)}%`;
        els.volumeRange.value = Math.round(state.volume * 100);

        els.chakraButtons.querySelectorAll(".chakra-button").forEach((button) => {
          button.setAttribute("aria-pressed", Number(button.dataset.index) === state.chakraIndex ? "true" : "false");
        });
      }

      function retuneAudio() {
        if (!state.audio) {
          return;
        }

        const now = state.audio.context.currentTime;
        state.audio.voices.forEach((voice) => {
          voice.osc.frequency.setTargetAtTime(state.frequency * voice.ratio, now, 0.45);
        });
        state.audio.noiseFilter.frequency.setTargetAtTime(state.frequency, now, 0.45);
        state.audio.lowpass.frequency.setTargetAtTime(Math.max(840, Math.min(2600, state.frequency * 2.8)), now, 0.7);
      }

      function shouldUseMediaOnly() {
        return forceMediaAudio || !hasWebAudio;
      }

      function shouldPrimeMediaAudio() {
        return shouldUseMediaOnly() || state.isMobileAudio;
      }

      function currentAudioMode() {
        if (shouldUseMediaOnly()) {
          return "media";
        }
        if (state.isMobileAudio && state.mediaAudio && !state.mediaAudio.paused) {
          return "hybrid";
        }
        return "web-audio";
      }

      function mediaTargetVolume() {
        if (!state.audioEnabled || !shouldPrimeMediaAudio()) {
          return 0;
        }
        if (shouldUseMediaOnly() || state.mediaFallbackAudible) {
          return Math.min(0.9, Math.max(0, state.volume));
        }
        return state.isMobileAudio ? Math.min(0.38, Math.max(0, state.volume * 0.42)) : 0;
      }

      function webAudioTargetVolume() {
        if (!state.audioEnabled || shouldUseMediaOnly()) {
          return 0;
        }
        const mobileScale = state.isMobileAudio ? 0.72 : 1;
        return state.volume * mobileScale;
      }

      function setFrequency(value) {
        state.frequency = Math.max(174, Math.min(963, Math.round(Number(value))));
        syncChakraUi();
        retuneAudio();
        syncMediaAudio(true);
      }

      function setVolume(value) {
        state.volume = Math.max(0, Math.min(0.8, Number(value) / 100));
        syncChakraUi();
        syncMediaVolume();
        if (state.audio) {
          const now = state.audio.context.currentTime;
          state.audio.master.gain.cancelScheduledValues(now);
          state.audio.master.gain.setTargetAtTime(webAudioTargetVolume(), now, 0.4);
        }
      }

      function setChakra(index, options = {}) {
        const nextIndex = (index + CHAKRAS.length) % CHAKRAS.length;
        state.chakraIndex = nextIndex;
        state.frequency = CHAKRAS[nextIndex].frequency;
        state.chakraLastAdvance = options.now || performance.now();
        syncChakraUi();
        retuneAudio();
        syncMediaAudio(true);
      }

      function updateChakraAuto(now) {
        if (!state.chakraAuto) {
          return;
        }

        if (now - state.chakraLastAdvance >= state.chakraAutoMs) {
          setChakra(state.chakraIndex + 1, { now });
        }
      }

      function bindControls() {
        els.chakraButtons.addEventListener("click", (event) => {
          const button = event.target.closest(".chakra-button");
          if (!button) {
            return;
          }
          setChakra(Number(button.dataset.index));
          nudgeAudio();
        });

        els.autoChakra.addEventListener("change", () => {
          state.chakraAuto = els.autoChakra.checked;
          state.chakraLastAdvance = performance.now();
          nudgeAudio();
        });

        els.frequencyRange.addEventListener("input", () => {
          setFrequency(els.frequencyRange.value);
          nudgeAudio();
        });

        els.volumeRange.addEventListener("input", () => {
          setVolume(els.volumeRange.value);
          nudgeAudio();
        });

        els.breathRanges.forEach((range) => {
          range.addEventListener("input", () => {
            setBreathDuration(Number(range.dataset.breathIndex), Number(range.value));
          });
        });

        els.breathReset.addEventListener("click", resetBreathDurations);

        els.gratitudeNext.addEventListener("click", () => {
          setGratitude(state.gratitudeIndex + 1);
        });

        els.gratitudePlant.addEventListener("click", () => {
          setGratitude(state.gratitudeIndex + 1);
          plantGratitude();
        });

        els.greenTeaLink.addEventListener("click", (event) => {
          if (!GREEN_TEA_URL) {
            event.preventDefault();
          }
        });
      }

      function bindPanelControls() {
        const rememberSwipeStart = (x, y) => {
          state.panelGesture = { x, y };
        };

        const finishSwipe = (x, y) => {
          if (!state.panelGesture) {
            return;
          }
          const dx = x - state.panelGesture.x;
          const dy = y - state.panelGesture.y;
          state.panelGesture = null;
          if (Math.abs(dy) > 38 && Math.abs(dy) > Math.abs(dx) * 1.15) {
            setPanelCollapsed(dy > 0);
            nudgeAudio();
          }
        };

        els.panelToggle.addEventListener("click", (event) => {
          event.stopPropagation();
          setPanelCollapsed(!state.panelCollapsed);
          nudgeAudio();
        });

        els.chakraPanel.addEventListener("click", (event) => {
          if (state.panelCollapsed && !event.target.closest(".panel-toggle")) {
            setPanelCollapsed(false);
            nudgeAudio();
          }
        });

        els.chakraPanel.addEventListener("pointerdown", (event) => {
          nudgeAudio();
          rememberSwipeStart(event.clientX, event.clientY);
        }, { passive: true });

        window.addEventListener("pointerup", (event) => {
          finishSwipe(event.clientX, event.clientY);
        }, { passive: true });

        els.chakraPanel.addEventListener("touchstart", (event) => {
          const touch = event.touches[0];
          if (touch) {
            rememberSwipeStart(touch.clientX, touch.clientY);
          }
        }, { passive: true });

        window.addEventListener("touchend", (event) => {
          const touch = event.changedTouches[0];
          if (touch) {
            finishSwipe(touch.clientX, touch.clientY);
          }
        }, { passive: true });

        const bindSidePanel = (name, panel, toggle) => {
          toggle.addEventListener("click", (event) => {
            event.stopPropagation();
            setSidePanelCollapsed(name, !state.sidePanelCollapsed[name]);
          });

          panel.addEventListener("click", (event) => {
            if (state.sidePanelCollapsed[name] && !event.target.closest(".panel-toggle")) {
              setSidePanelCollapsed(name, false);
            }
          });
        };

        bindSidePanel("gratitude", els.gratitudePanel, els.gratitudeToggle);
        bindSidePanel("breath", els.breathPanel, els.breathToggle);

        const followViewport = () => {
          if (!state.panelUserSet) {
            setPanelCollapsed(mobileControls.matches, false);
          }
        };

        if (mobileControls.addEventListener) {
          mobileControls.addEventListener("change", followViewport);
        } else {
          mobileControls.addListener(followViewport);
        }
      }

      function cycleMantra() {
        state.mantraIndex = (state.mantraIndex + 1) % MANTRAS.length;
        els.mantra.classList.add("fade-out");
        window.setTimeout(() => {
          setMantra(state.mantraIndex);
          els.mantra.classList.remove("fade-out");
        }, 1100);
      }

      function currentBreath(now) {
        let position = (now - state.breathStart) % breathTotal;
        for (let index = 0; index < BREATH.length; index += 1) {
          const phase = BREATH[index];
          if (position < phase.ms) {
            return { index, phase, elapsed: position };
          }
          position -= phase.ms;
        }
        return { index: 0, phase: BREATH[0], elapsed: 0 };
      }

      function updateBreath(now) {
        const current = currentBreath(now);
        const progress = current.elapsed / current.phase.ms;
        const remaining = Math.max(1, Math.ceil((current.phase.ms - current.elapsed) / 1000));

        document.documentElement.style.setProperty("--breath-progress", `${progress * 360}deg`);
        els.count.textContent = remaining;

        if (current.index !== state.activeBreath) {
          state.activeBreath = current.index;
          els.phase.textContent = current.phase.name;
          document.documentElement.style.setProperty("--breath-scale", current.phase.scale);
          document.documentElement.style.setProperty("--phase-hue", current.phase.hue);
        }
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function smoothStep(value) {
        const t = clamp(value, 0, 1);
        return t * t * (3 - 2 * t);
      }

      function gardenPointToPlant(point, kind, plantedAt) {
        const matureMs = PLANT_KINDS.find((plantKind) => plantKind.kind === kind).matureMs;
        const flowerHues = [326, 24, 46, 196, 286, 156];
        const hue = kind === "tree"
          ? 104 + Math.random() * 54
          : flowerHues[Math.floor(Math.random() * flowerHues.length)] + Math.random() * 10 - 5;

        return {
          kind,
          nx: clamp(point.x / state.width, 0.02, 0.98),
          ny: clamp(point.y / state.height, 0.02, 0.98),
          plantedAt,
          matureMs,
          hue,
          size: 0.78 + Math.random() * 0.72,
          seed: Math.random() * 1000
        };
      }

      function randomGardenPoint() {
        const margin = 28;
        const centerX = state.width / 2;
        const centerY = state.height / 2;
        const focusClear = Math.min(state.width, state.height) * 0.22;
        const mantraClear = Math.min(state.height * 0.24, 220);
        const panelWidth = Math.min(360, state.width * 0.62);
        const panelHeight = Math.min(230, state.height * 0.36);

        for (let attempt = 0; attempt < 48; attempt += 1) {
          const x = margin + Math.random() * Math.max(1, state.width - margin * 2);
          const y = margin + Math.random() * Math.max(1, state.height - margin * 2);
          const dx = x - centerX;
          const dy = y - centerY;
          const inFocus = Math.hypot(dx, dy) < focusClear;
          const inMantra = y < mantraClear && Math.abs(dx) < state.width * 0.42;
          const inPanel = x < panelWidth && y > state.height - panelHeight;

          if (!inFocus && !inMantra && !inPanel) {
            return { x, y };
          }
        }

        return {
          x: centerX + (Math.random() > 0.5 ? 1 : -1) * (focusClear + Math.random() * 120),
          y: centerY + (Math.random() > 0.5 ? 1 : -1) * (focusClear + Math.random() * 120)
        };
      }

      function choosePlantKind() {
        state.garden.plantCount += 1;
        if (state.garden.plantCount % 7 === 0) {
          return "tree";
        }

        const totalWeight = PLANT_KINDS.reduce((sum, plantKind) => sum + plantKind.weight, 0);
        let draw = Math.random() * totalWeight;
        for (const plantKind of PLANT_KINDS) {
          draw -= plantKind.weight;
          if (draw <= 0) {
            return plantKind.kind;
          }
        }
        return "flower";
      }

      function saveGarden() {
        try {
          const plants = state.garden.plants.slice(-GARDEN_LIMIT);
          window.localStorage.setItem(GARDEN_KEY, JSON.stringify({ plants }));
          state.garden.plants = plants;
          state.garden.lastSave = performance.now();
        } catch (error) {
          state.garden.lastSave = performance.now();
        }
      }

      function loadGarden() {
        try {
          const saved = JSON.parse(window.localStorage.getItem(GARDEN_KEY) || "{}");
          if (Array.isArray(saved.plants)) {
            state.garden.plants = saved.plants
              .filter((plant) => Number.isFinite(plant.nx) && Number.isFinite(plant.ny) && plant.plantedAt)
              .slice(-GARDEN_LIMIT);
            state.garden.plantCount = state.garden.plants.length;
          }
        } catch (error) {
          state.garden.plants = [];
        }
      }

      function seedGarden() {
        if (state.garden.plants.length > 0 || state.width === 0 || state.height === 0) {
          return;
        }

        const now = Date.now();
        for (let index = 0; index < 14; index += 1) {
          const kind = index % 6 === 0 ? "tree" : "flower";
          const point = randomGardenPoint();
          const matureMs = PLANT_KINDS.find((plantKind) => plantKind.kind === kind).matureMs;
          const age = kind === "tree"
            ? matureMs * (0.16 + Math.random() * 0.32)
            : matureMs * (0.54 + Math.random() * 0.44);
          state.garden.plants.push(gardenPointToPlant(point, kind, now - age));
        }
        state.garden.plantCount = state.garden.plants.length;
        saveGarden();
      }

      function plantGratitude() {
        if (state.width === 0 || state.height === 0) {
          return;
        }

        const now = Date.now();
        for (let index = 0; index < 5; index += 1) {
          const point = randomGardenPoint();
          const plant = gardenPointToPlant(point, "flower", now - 7 * 60 * 1000 * Math.random());
          state.garden.plants.push(plant);
        }
        if (state.garden.plants.length > GARDEN_LIMIT) {
          state.garden.plants = state.garden.plants.slice(-GARDEN_LIMIT);
        }
        state.garden.bee.pollen = 1;
        saveGarden();
      }

      function chooseBeeTarget() {
        const now = Date.now();
        const plants = state.garden.plants.filter((plant) => {
          const age = now - plant.plantedAt;
          return age > plant.matureMs * 0.18;
        });

        if (plants.length > 0 && Math.random() < 0.68) {
          const plant = plants[Math.floor(Math.random() * plants.length)];
          const lift = plant.kind === "tree" ? 28 : 13;
          return {
            x: clamp(plant.nx * state.width + (Math.random() * 28 - 14), 24, state.width - 24),
            y: clamp(plant.ny * state.height - lift + (Math.random() * 20 - 10), 24, state.height - 24),
            action: "pollinate"
          };
        }

        return {
          ...randomGardenPoint(),
          action: Math.random() < 0.26 ? "dart" : "scout"
        };
      }

      function placeBee() {
        const point = randomGardenPoint();
        const bee = state.garden.bee;
        bee.x = point.x;
        bee.y = point.y;
        setBeeTarget();
      }

      function setBeeTarget() {
        const target = chooseBeeTarget();
        const bee = state.garden.bee;
        bee.targetX = target.x;
        bee.targetY = target.y;
        bee.action = target.action;
        bee.actionUntil = performance.now() + (
          target.action === "pollinate"
            ? 2600 + Math.random() * 2600
            : target.action === "dart"
              ? 900 + Math.random() * 1200
              : 2200 + Math.random() * 3200
        );
      }

      function startleBee(x, y, pointerType = "mouse") {
        const bee = state.garden.bee;
        if (!bee.x || !bee.y) {
          return;
        }

        const distance = Math.hypot(bee.x - x, bee.y - y);
        const startleRadius = pointerType === "touch" ? 76 : 48;
        if (distance > startleRadius) {
          return;
        }

        const angle = Math.atan2(bee.y - y, bee.x - x) + (Math.random() * 0.7 - 0.35);
        const jump = pointerType === "touch" ? 230 : 180;
        bee.targetX = clamp(bee.x + Math.cos(angle) * jump, 24, state.width - 24);
        bee.targetY = clamp(bee.y + Math.sin(angle) * jump, 24, state.height - 24);
        bee.action = "dart";
        bee.actionUntil = performance.now() + 900 + Math.random() * 650;
        bee.pollen = Math.max(bee.pollen, 0.86);
        document.documentElement.dataset.bee = "startled";
      }

      function pollinateNearBee(now) {
        const bee = state.garden.bee;
        let point = {
          x: clamp(bee.x + (Math.random() * 44 - 22), 24, state.width - 24),
          y: clamp(bee.y + (Math.random() * 36 - 10), 24, state.height - 24)
        };
        const centerDistance = Math.hypot(point.x - state.width / 2, point.y - state.height / 2);
        if (centerDistance < Math.min(state.width, state.height) * 0.24) {
          point = randomGardenPoint();
        }

        const kind = Math.random() < 0.82 ? "flower" : choosePlantKind();
        state.garden.plants.push(gardenPointToPlant(point, kind, Date.now()));
        if (state.garden.plants.length > GARDEN_LIMIT) {
          state.garden.plants = state.garden.plants.slice(-GARDEN_LIMIT);
        }
        bee.pollen = 1;
        bee.nextPlantAt = now + PLANT_INTERVAL_MS * (0.48 + Math.random() * 0.42);
        saveGarden();
      }

      function updateGarden(now) {
        const garden = state.garden;
        const bee = garden.bee;
        const dt = Math.min(0.09, Math.max(0, (now - garden.lastTick) / 1000));
        garden.lastTick = now;

        if (!reducedMotion) {
          const dx = bee.targetX - bee.x;
          const dy = bee.targetY - bee.y;
          const distance = Math.hypot(dx, dy);

          if (distance < (bee.action === "pollinate" ? 16 : 10) || now > bee.actionUntil) {
            if (bee.action === "pollinate" && distance < 36 && now >= bee.nextPlantAt) {
              pollinateNearBee(now);
            }
            setBeeTarget();
          } else if (distance > 0.5) {
            const nx = dx / distance;
            const ny = dy / distance;
            const px = -ny;
            const py = nx;
            const baseSpeed = bee.action === "dart" ? 84 : bee.action === "pollinate" ? 36 : 54;
            const pulse = Math.sin(now * 0.012 + bee.stepSeed) * (bee.action === "dart" ? 18 : 8);
            const wobble = Math.sin(now * 0.02 + bee.stepSeed) * (bee.action === "pollinate" ? 18 : 30);
            bee.vx = nx * (baseSpeed + pulse) + px * wobble;
            bee.vy = ny * (baseSpeed + pulse) + py * wobble;
            bee.x += bee.vx * dt;
            bee.y += bee.vy * dt;
            bee.direction = bee.vx < 0 ? -1 : 1;

            if (bee.action === "pollinate" && distance < 42) {
              bee.pollen = Math.max(bee.pollen, 0.64);
              if (now >= bee.nextPlantAt) {
                pollinateNearBee(now);
              }
            }

            const centerX = state.width / 2;
            const centerY = state.height / 2;
            const focusClear = Math.min(state.width, state.height) * 0.24;
            const centerDistance = Math.hypot(bee.x - centerX, bee.y - centerY);
            if (centerDistance < focusClear) {
              const angle = Math.atan2(bee.y - centerY, bee.x - centerX);
              bee.x = centerX + Math.cos(angle) * focusClear;
              bee.y = centerY + Math.sin(angle) * focusClear;
              setBeeTarget();
            }
          }

          bee.pollen = Math.max(0, bee.pollen - dt * 0.72);
          bee.x = clamp(bee.x, 16, state.width - 16);
          bee.y = clamp(bee.y, 16, state.height - 16);
        }

        if (now - garden.lastSave > 18000) {
          saveGarden();
        }
      }

      function drawFlowerPlant(plant, x, y, maturity, now) {
        const breeze = Math.sin(now * 0.001 + plant.seed) * (1.4 + maturity * 2.2);
        const stem = (10 + plant.size * 22) * maturity;
        const bloom = (3.2 + plant.size * 7.4) * maturity;
        const leaf = (2.8 + plant.size * 4.2) * maturity;

        gardenCtx.save();
        gardenCtx.translate(x, y);
        gardenCtx.globalAlpha = 0.3 + maturity * 0.68;
        gardenCtx.strokeStyle = `hsla(${116 + plant.hue * 0.06}, 54%, 62%, 0.62)`;
        gardenCtx.lineWidth = Math.max(0.7, plant.size * 1.1);
        gardenCtx.beginPath();
        gardenCtx.moveTo(0, 0);
        gardenCtx.quadraticCurveTo(breeze * 0.32, -stem * 0.5, breeze, -stem);
        gardenCtx.stroke();

        gardenCtx.fillStyle = `hsla(${132 + plant.hue * 0.04}, 56%, 58%, 0.44)`;
        gardenCtx.beginPath();
        gardenCtx.ellipse(-leaf * 0.8, -stem * 0.45, leaf, leaf * 0.38, -0.7, 0, Math.PI * 2);
        gardenCtx.ellipse(leaf * 0.9, -stem * 0.62, leaf * 0.88, leaf * 0.34, 0.62, 0, Math.PI * 2);
        gardenCtx.fill();

        gardenCtx.translate(breeze, -stem);
        for (let petal = 0; petal < 6; petal += 1) {
          const angle = petal * Math.PI * 2 / 6 + plant.seed;
          gardenCtx.fillStyle = `hsla(${plant.hue}, 78%, ${64 + petal * 2}%, ${0.48 + maturity * 0.4})`;
          gardenCtx.beginPath();
          gardenCtx.ellipse(Math.cos(angle) * bloom * 0.72, Math.sin(angle) * bloom * 0.72, bloom * 0.58, bloom * 0.28, angle, 0, Math.PI * 2);
          gardenCtx.fill();
        }
        gardenCtx.fillStyle = "rgba(255, 239, 163, 0.78)";
        gardenCtx.beginPath();
        gardenCtx.arc(0, 0, Math.max(0.8, bloom * 0.34), 0, Math.PI * 2);
        gardenCtx.fill();
        gardenCtx.restore();
      }

      function drawTreePlant(plant, x, y, maturity, now) {
        const sway = Math.sin(now * 0.00078 + plant.seed) * (2 + maturity * 3.4);
        const height = (20 + plant.size * 44) * maturity;
        const canopy = (10 + plant.size * 24) * maturity;

        gardenCtx.save();
        gardenCtx.translate(x, y);
        gardenCtx.globalAlpha = 0.28 + maturity * 0.64;
        gardenCtx.strokeStyle = `hsla(${28 + plant.hue * 0.08}, 52%, 40%, 0.64)`;
        gardenCtx.lineWidth = Math.max(1.1, plant.size * 2.2 * maturity);
        gardenCtx.beginPath();
        gardenCtx.moveTo(0, 0);
        gardenCtx.quadraticCurveTo(sway * 0.16, -height * 0.46, sway, -height);
        gardenCtx.stroke();

        gardenCtx.strokeStyle = `hsla(${32 + plant.hue * 0.05}, 48%, 48%, 0.42)`;
        for (let branch = -1; branch <= 1; branch += 2) {
          gardenCtx.beginPath();
          gardenCtx.moveTo(sway * 0.42, -height * 0.58);
          gardenCtx.quadraticCurveTo(branch * canopy * 0.45, -height * 0.72, branch * canopy * 0.92, -height * 0.88);
          gardenCtx.stroke();
        }

        const topY = -height;
        const canopyHues = [plant.hue, plant.hue + 16, plant.hue - 18];
        canopyHues.forEach((hue, index) => {
          gardenCtx.fillStyle = `hsla(${hue}, 58%, ${45 + index * 6}%, ${0.36 + maturity * 0.34})`;
          gardenCtx.beginPath();
          gardenCtx.arc(sway + (index - 1) * canopy * 0.42, topY + index * canopy * 0.18, canopy * (0.72 + index * 0.1), 0, Math.PI * 2);
          gardenCtx.fill();
        });
        gardenCtx.restore();
      }

      function drawBee(now) {
        const bee = state.garden.bee;
        document.documentElement.dataset.beeX = String(Math.round(bee.x));
        document.documentElement.dataset.beeY = String(Math.round(bee.y));
        const size = clamp(Math.min(state.width, state.height) / 650, 0.76, 1.22);
        const speed = Math.hypot(bee.vx, bee.vy);
        const angle = speed > 1 ? Math.atan2(bee.vy, bee.vx) : 0;
        const hover = Math.sin(now * 0.009 + bee.stepSeed) * 2.2;
        const wing = Math.sin(now * 0.064 + bee.wingSeed);
        const pollenGlow = bee.action === "pollinate" ? Math.max(bee.pollen, 0.28) : bee.pollen;

        gardenCtx.save();
        gardenCtx.translate(bee.x, bee.y + 7);
        gardenCtx.globalAlpha = 0.22;
        gardenCtx.fillStyle = "rgba(5, 8, 7, 0.5)";
        gardenCtx.beginPath();
        gardenCtx.ellipse(0, 0, 8.8 * size, 2.2 * size, 0, 0, Math.PI * 2);
        gardenCtx.fill();
        gardenCtx.restore();

        gardenCtx.save();
        gardenCtx.translate(bee.x, bee.y + hover);
        gardenCtx.rotate(angle);
        gardenCtx.scale(size, size);

        gardenCtx.globalAlpha = 0.34 + Math.abs(wing) * 0.18;
        gardenCtx.fillStyle = "rgba(214, 250, 255, 0.74)";
        gardenCtx.beginPath();
        gardenCtx.ellipse(-2.2, -5.4, 7.6, 3.1, -0.72 - wing * 0.18, 0, Math.PI * 2);
        gardenCtx.ellipse(-2.2, 5.4, 7.6, 3.1, 0.72 + wing * 0.18, 0, Math.PI * 2);
        gardenCtx.fill();

        gardenCtx.globalAlpha = 0.95;
        gardenCtx.fillStyle = "rgba(251, 198, 64, 0.98)";
        gardenCtx.beginPath();
        gardenCtx.ellipse(0, 0, 10.4, 6.1, 0, 0, Math.PI * 2);
        gardenCtx.fill();

        gardenCtx.fillStyle = "rgba(21, 17, 13, 0.9)";
        [-4.4, 0.2, 4.6].forEach((stripe) => {
          gardenCtx.beginPath();
          gardenCtx.ellipse(stripe, 0, 1.5, 5.7, 0, 0, Math.PI * 2);
          gardenCtx.fill();
        });

        gardenCtx.fillStyle = "rgba(33, 24, 15, 0.92)";
        gardenCtx.beginPath();
        gardenCtx.arc(9.2, 0, 4.2, 0, Math.PI * 2);
        gardenCtx.fill();

        gardenCtx.strokeStyle = "rgba(33, 24, 15, 0.72)";
        gardenCtx.lineWidth = 1;
        gardenCtx.beginPath();
        gardenCtx.moveTo(11.4, -2.2);
        gardenCtx.quadraticCurveTo(15.2, -6.2, 17.2, -4.8);
        gardenCtx.moveTo(11.4, 2.2);
        gardenCtx.quadraticCurveTo(15.2, 6.2, 17.2, 4.8);
        gardenCtx.stroke();

        gardenCtx.fillStyle = "rgba(255, 235, 149, 0.86)";
        gardenCtx.beginPath();
        gardenCtx.moveTo(-10.6, 0);
        gardenCtx.lineTo(-14.2, -2.2);
        gardenCtx.lineTo(-14.2, 2.2);
        gardenCtx.closePath();
        gardenCtx.fill();

        if (pollenGlow > 0) {
          gardenCtx.globalAlpha = pollenGlow * 0.72;
          gardenCtx.fillStyle = "rgba(255, 235, 143, 0.92)";
          for (let dot = 0; dot < 5; dot += 1) {
            const drift = now * 0.004 + dot;
            gardenCtx.beginPath();
            gardenCtx.arc(-13 - dot * 3.6, Math.sin(drift) * 4.6, 1.2 - dot * 0.1, 0, Math.PI * 2);
            gardenCtx.fill();
          }
        }
        gardenCtx.restore();
      }

      function drawGarden(now) {
        gardenCtx.clearRect(0, 0, state.width, state.height);
        gardenCtx.globalCompositeOperation = "source-over";

        const plants = state.garden.plants.slice().sort((a, b) => a.ny - b.ny);
        plants.forEach((plant) => {
          const age = Math.max(0, Date.now() - plant.plantedAt);
          const maturity = smoothStep(age / plant.matureMs);
          const x = plant.nx * state.width;
          const y = plant.ny * state.height;
          if (plant.kind === "tree") {
            drawTreePlant(plant, x, y, maturity, now);
          } else {
            drawFlowerPlant(plant, x, y, maturity, now);
          }
        });

        drawBee(now);
      }

      function setStroke(hue, alpha, width) {
        ctx.strokeStyle = `hsla(${hue}, 82%, 72%, ${alpha})`;
        ctx.lineWidth = width;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
      }

      function circle(x, y, radius) {
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.stroke();
      }

      function line(a, b) {
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }

      function points(sides, radius, rotation) {
        return Array.from({ length: sides }, (_, index) => {
          const angle = rotation + index * Math.PI * 2 / sides;
          return { x: Math.cos(angle) * radius, y: Math.sin(angle) * radius };
        });
      }

      function polygon(vertices) {
        ctx.beginPath();
        vertices.forEach((point, index) => {
          if (index === 0) {
            ctx.moveTo(point.x, point.y);
          } else {
            ctx.lineTo(point.x, point.y);
          }
        });
        ctx.closePath();
        ctx.stroke();
      }

      function drawFlowerOfLife(unit, hue, breath) {
        const sqrt3 = Math.sqrt(3);
        setStroke(hue, 0.08 + breath * 0.04, 0.7 + breath * 0.35);
        for (let q = -2; q <= 2; q += 1) {
          for (let r = -2; r <= 2; r += 1) {
            const s = -q - r;
            if (Math.max(Math.abs(q), Math.abs(r), Math.abs(s)) <= 2) {
              circle(unit * (q + r / 2), unit * (sqrt3 / 2) * r, unit);
            }
          }
        }
      }

      function drawGeometry(now) {
        const cx = state.width / 2;
        const cy = state.height / 2;
        const size = Math.min(state.width, state.height);
        const unit = size * 0.104;
        const breath = reducedMotion ? 0.5 : (Math.sin(now * 0.00042) + 1) / 2;
        const chakra = CHAKRAS[state.chakraIndex];
        const hue = (chakra.hue + (now * 0.0009) % 46) % 360;

        ctx.clearRect(0, 0, state.width, state.height);
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(now * 0.000045);
        ctx.globalCompositeOperation = "lighter";

        drawFlowerOfLife(unit, hue, breath);

        setStroke((hue + 84) % 360, 0.12 + breath * 0.035, 0.9);
        circle(-unit * 0.72, 0, unit * 2.04);
        circle(unit * 0.72, 0, unit * 2.04);
        circle(0, -unit * 0.72, unit * 2.04);
        circle(0, unit * 0.72, unit * 2.04);

        const outer = unit * 3.22;
        const inner = unit * 1.92;
        const outerHex = points(6, outer, Math.PI / 6);
        const innerHex = points(6, inner, Math.PI / 6);

        setStroke((hue + 18) % 360, 0.16, 0.9);
        polygon(outerHex);
        polygon(points(3, outer * 0.92, -Math.PI / 2));
        polygon(points(3, outer * 0.92, Math.PI / 2));

        setStroke((hue + 142) % 360, 0.1, 0.65);
        innerHex.forEach((point, index) => {
          line({ x: 0, y: 0 }, point);
          line(point, innerHex[(index + 2) % innerHex.length]);
          line(point, outerHex[index]);
          circle(point.x, point.y, 2.2 + breath * 1.2);
        });

        setStroke((hue + 302) % 360, 0.07, 0.55);
        outerHex.forEach((point, index) => {
          line(point, outerHex[(index + 1) % outerHex.length]);
          line(point, outerHex[(index + 3) % outerHex.length]);
        });

        setStroke(hue, 0.18, 0.75);
        circle(0, 0, unit * 0.36);
        circle(0, 0, unit * 2.42);
        circle(0, 0, unit * 3.58);
        ctx.restore();

        const glow = ctx.createRadialGradient(cx, cy, size * 0.05, cx, cy, size * 0.56);
        glow.addColorStop(0, `rgba(255, 247, 221, ${0.16 + breath * 0.08})`);
        glow.addColorStop(0.36, "rgba(240, 197, 107, 0.06)");
        glow.addColorStop(0.72, "rgba(142, 223, 207, 0.025)");
        glow.addColorStop(1, "rgba(5, 8, 7, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, state.width, state.height);
      }

      function animate(now) {
        updateChakraAuto(now);
        updateBreath(now);
        updateGarden(now);
        drawGeometry(now);
        drawGarden(now);
        if (!reducedMotion) {
          requestAnimationFrame(animate);
        }
      }

      function syncAudioToggle() {
        els.audioToggle.dataset.audio = state.audioEnabled ? "on" : "off";
        els.audioToggle.setAttribute("aria-label", state.audioEnabled ? "Turn sound off" : "Turn sound on");
        els.audioToggle.title = state.audioEnabled ? "Turn sound off" : "Turn sound on";
      }

      function nudgeAudio() {
        if (state.audioEnabled) {
          if (shouldPrimeMediaAudio()) {
            startMediaAudio();
          }
          if (!shouldUseMediaOnly()) {
            startAudio();
          }
        }
      }

      function setAudioEnabled(enabled) {
        state.audioEnabled = enabled;
        syncAudioToggle();

        if (state.audioEnabled) {
          state.audioSettled = false;
          state.mediaFallbackAudible = shouldUseMediaOnly();
          if (shouldPrimeMediaAudio()) {
            startMediaAudio();
          }
          if (!shouldUseMediaOnly()) {
            startAudio();
          }
          window.setTimeout(settleAudioRoute, 1400);
          return;
        }

        state.audioSettled = false;
        state.mediaFallbackAudible = false;
        document.documentElement.dataset.audio = "off";
        stopMediaAudio();
        if (state.audio) {
          const now = state.audio.context.currentTime;
          state.audio.master.gain.cancelScheduledValues(now);
          state.audio.master.gain.setTargetAtTime(0, now, 0.18);
        }
      }

      function bindAudioToggle() {
        let suppressClickUntil = 0;
        const toggle = (event) => {
          event.preventDefault();
          event.stopPropagation();
          const now = performance.now();
          if (now < suppressClickUntil) {
            return;
          }
          suppressClickUntil = now + 850;
          state.lastAudioGesture = event.type;
          setAudioEnabled(!state.audioEnabled);
        };

        if (window.PointerEvent) {
          els.audioToggle.addEventListener("pointerdown", toggle);
        } else {
          els.audioToggle.addEventListener("touchstart", toggle);
          els.audioToggle.addEventListener("touchend", toggle);
        }
        els.audioToggle.addEventListener("click", toggle);
        els.audioToggle.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            toggle(event);
          }
        });
      }

      function playUnlockPulse(audio) {
        const now = audio.currentTime;
        const buffer = audio.createBuffer(1, 1, audio.sampleRate);
        const source = audio.createBufferSource();
        const unlockGain = audio.createGain();
        unlockGain.gain.setValueAtTime(0.0008, now);
        source.buffer = buffer;
        source.connect(unlockGain);
        unlockGain.connect(audio.destination);
        source.start(now);
        source.stop(now + 0.02);
      }

      function writeString(view, offset, value) {
        for (let index = 0; index < value.length; index += 1) {
          view.setUint8(offset + index, value.charCodeAt(index));
        }
      }

      function createMediaDroneUrl(frequency) {
        const sampleRate = 44100;
        const duration = 12.5;
        const samples = sampleRate * duration;
        const buffer = new ArrayBuffer(44 + samples * 2);
        const view = new DataView(buffer);

        writeString(view, 0, "RIFF");
        view.setUint32(4, 36 + samples * 2, true);
        writeString(view, 8, "WAVE");
        writeString(view, 12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(view, 36, "data");
        view.setUint32(40, samples * 2, true);

        for (let index = 0; index < samples; index += 1) {
          const time = index / sampleRate;
          const breath = 0.88 + Math.sin(time * Math.PI * 2 * 0.08) * 0.1;
          const shimmer = 0.96 + Math.sin(time * Math.PI * 2 * 0.16) * 0.04;
          const sample = (
            Math.sin(time * Math.PI * 2 * frequency) * 0.5 +
            Math.sin(time * Math.PI * 2 * frequency * 0.5) * 0.28 +
            Math.sin(time * Math.PI * 2 * frequency * 2) * 0.1 +
            Math.sin(time * Math.PI * 2 * 432) * 0.07
          ) * breath * shimmer;
          view.setInt16(44 + index * 2, Math.max(-0.95, Math.min(0.95, sample)) * 32767, true);
        }

        return URL.createObjectURL(new Blob([view], { type: "audio/wav" }));
      }

      function ensureMediaAudio() {
        if (!state.mediaAudio) {
          const media = els.mobileAudio || new Audio();
          media.loop = true;
          media.preload = "auto";
          media.controls = false;
          media.setAttribute("playsinline", "");
          media.setAttribute("webkit-playsinline", "");
          media.preservesPitch = false;
          media.mozPreservesPitch = false;
          media.webkitPreservesPitch = false;
          media.addEventListener("playing", () => {
            document.documentElement.dataset.audioMedia = "on";
          });
          media.addEventListener("error", () => {
            const error = media.error;
            document.documentElement.dataset.audioMedia = "error";
            document.documentElement.dataset.audioError = error ? `media-${error.code}` : "media-error";
          });
          state.mediaAudio = media;
        }
        if (!state.mediaAudio.src) {
          state.mediaAudioUrl = createMediaDroneUrl(MEDIA_BASE_FREQUENCY);
          state.mediaFrequency = MEDIA_BASE_FREQUENCY;
          state.mediaAudio.src = state.mediaAudioUrl;
          state.mediaAudio.load();
        }
        return state.mediaAudio;
      }

      function syncMediaPitch(media = state.mediaAudio) {
        if (!media) {
          return;
        }
        const rate = Math.max(0.5, Math.min(2.5, state.frequency / MEDIA_BASE_FREQUENCY));
        media.defaultPlaybackRate = rate;
        media.playbackRate = rate;
        media.preservesPitch = false;
        media.mozPreservesPitch = false;
        media.webkitPreservesPitch = false;
        document.documentElement.dataset.audioRate = rate.toFixed(2);
      }

      function syncMediaAudio() {
        if (!state.audioEnabled || !shouldPrimeMediaAudio()) {
          return;
        }

        const media = ensureMediaAudio();
        syncMediaPitch(media);
      }

      function syncMediaVolume() {
        if (state.mediaAudio) {
          state.mediaAudio.volume = mediaTargetVolume();
        }
      }

      function startMediaAudio() {
        if (!shouldPrimeMediaAudio()) {
          document.documentElement.dataset.audioMedia = "unused";
          return;
        }

        document.documentElement.dataset.audioMode = currentAudioMode();
        const media = ensureMediaAudio();
        syncMediaAudio();
        syncMediaVolume();
        media.muted = false;
        document.documentElement.dataset.audioMedia = "starting";
        const playRequest = media.play();
        if (playRequest && typeof playRequest.then === "function") {
          playRequest.then(() => {
            document.documentElement.dataset.audioMedia = "on";
          }).catch((error) => {
            document.documentElement.dataset.audioMedia = "blocked";
            document.documentElement.dataset.audioError = error && error.name ? error.name : "media-play-failed";
          });
        } else {
          document.documentElement.dataset.audioMedia = "on";
        }
      }

      function prepareMediaFallback() {
        if (!shouldPrimeMediaAudio()) {
          document.documentElement.dataset.audioMedia = "unused";
          return;
        }
        ensureMediaAudio();
        syncMediaPitch();
        syncMediaVolume();
        if (!document.documentElement.dataset.audioMedia) {
          document.documentElement.dataset.audioMedia = "ready";
        }
      }

      function stopMediaAudio() {
        if (state.mediaAudio) {
          state.mediaAudio.pause();
          state.mediaAudio.currentTime = 0;
        }
        document.documentElement.dataset.audioMedia = "off";
      }

      function measureWebAudioLevel() {
        if (!state.audio || !state.audio.analyser || !state.audio.sampleData) {
          return 0;
        }
        state.audio.analyser.getByteTimeDomainData(state.audio.sampleData);
        let total = 0;
        for (let index = 0; index < state.audio.sampleData.length; index += 1) {
          const centered = (state.audio.sampleData[index] - 128) / 128;
          total += centered * centered;
        }
        return Math.sqrt(total / state.audio.sampleData.length);
      }

      function updateAudioDebug() {
        if (!audioDebugEnabled || !els.audioDebug) {
          return;
        }
        const media = state.mediaAudio || els.mobileAudio;
        const level = measureWebAudioLevel();
        els.audioDebug.textContent = [
          `sound ${state.audioEnabled ? "on" : "off"} | ${document.documentElement.dataset.audioMode || "idle"}`,
          `ctx ${document.documentElement.dataset.audioContext || "none"} | web ${document.documentElement.dataset.audio || "idle"}`,
          `media ${document.documentElement.dataset.audioMedia || "idle"} | ready ${media ? media.readyState : "n/a"} | t ${media ? media.currentTime.toFixed(1) : "0.0"}`,
          `level ${level.toFixed(3)} | gesture ${state.lastAudioGesture}`,
          `ua ${state.isMobileAudio ? "mobile/touch" : "desktop"}`
        ].join("\n");
      }

      function settleAudioRoute() {
        if (!state.audioEnabled) {
          return;
        }
        const webRunning = state.audio && state.audio.context.state === "running";
        state.audioSettled = true;
        state.mediaFallbackAudible = shouldUseMediaOnly() || !webRunning;
        if (!webRunning && shouldPrimeMediaAudio()) {
          document.documentElement.dataset.audio = state.audio ? "fallback" : "media-only";
          startMediaAudio();
        }
        document.documentElement.dataset.audioMode = currentAudioMode();
        syncMediaVolume();
        updateAudioDebug();
      }

      function connectPanned(audio, input, output, panValue) {
        const pan = audio.createStereoPanner ? audio.createStereoPanner() : audio.createGain();
        if (pan.pan) {
          pan.pan.value = panValue;
        }
        input.connect(pan);
        pan.connect(output);
        return pan;
      }

      function startAudio() {
        if (state.audio) {
          awakenAudio();
          return;
        }

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) {
          document.documentElement.dataset.audio = "unsupported";
          document.documentElement.dataset.audioMode = "media";
          state.mediaFallbackAudible = true;
          startMediaAudio();
          return;
        }

        document.documentElement.dataset.audio = "starting";
        document.documentElement.dataset.audioMode = state.isMobileAudio ? "hybrid" : "web-audio";
        let audio;
        try {
          audio = new AudioContext();
        } catch (error) {
          document.documentElement.dataset.audio = "unsupported";
          document.documentElement.dataset.audioError = error && error.name ? error.name : "audio-context";
          state.mediaFallbackAudible = true;
          startMediaAudio();
          return;
        }
        audio.onstatechange = () => {
          document.documentElement.dataset.audioContext = audio.state;
          updateAudioDebug();
        };
        playUnlockPulse(audio);
        const firstResume = audio.resume();
        if (firstResume && typeof firstResume.catch === "function") {
          firstResume.catch((error) => {
            document.documentElement.dataset.audio = "blocked";
            document.documentElement.dataset.audioError = error && error.name ? error.name : "resume-failed";
          });
        }
        const master = audio.createGain();
        const lowpass = audio.createBiquadFilter();
        const noiseFilter = audio.createBiquadFilter();
        const analyser = audio.createAnalyser();

        lowpass.type = "lowpass";
        lowpass.frequency.value = Math.max(840, Math.min(2600, state.frequency * 2.8));
        lowpass.Q.value = 0.28;
        noiseFilter.type = "bandpass";
        noiseFilter.frequency.value = state.frequency;
        noiseFilter.Q.value = 7.2;

        master.gain.value = 0;
        analyser.fftSize = 1024;
        master.connect(lowpass);
        lowpass.connect(analyser);
        analyser.connect(audio.destination);
        noiseFilter.connect(master);

        const voices = [
          { ratio: 0.125, gain: 0.014, pan: -0.46, type: "sine" },
          { ratio: 0.25, gain: 0.018, pan: 0.38, type: "sine" },
          { ratio: 0.5, gain: 0.012, pan: -0.24, type: "triangle" },
          { ratio: 1, gain: 0.01, pan: 0.1, type: "sine" },
          { ratio: 1.5, gain: 0.004, pan: 0.42, type: "sine" },
          { ratio: 2, gain: 0.003, pan: -0.08, type: "triangle" }
        ].map((voice, index) => {
          const osc = audio.createOscillator();
          const gain = audio.createGain();
          const lfo = audio.createOscillator();
          const lfoGain = audio.createGain();

          osc.type = voice.type;
          osc.frequency.value = state.frequency * voice.ratio;
          osc.detune.value = (index - 1.5) * 2.4;
          gain.gain.value = voice.gain;
          lfo.frequency.value = 0.024 + index * 0.007;
          lfoGain.gain.value = voice.gain * 0.45;

          lfo.connect(lfoGain);
          lfoGain.connect(gain.gain);
          osc.connect(gain);
          connectPanned(audio, gain, master, voice.pan);
          osc.start();
          lfo.start();
          return { osc, ratio: voice.ratio };
        });

        const noise = audio.createBufferSource();
        const buffer = audio.createBuffer(1, audio.sampleRate * 2, audio.sampleRate);
        const data = buffer.getChannelData(0);
        let last = 0;
        for (let i = 0; i < data.length; i += 1) {
          last = last * 0.96 + (Math.random() * 2 - 1) * 0.04;
          data[i] = last;
        }
        const noiseGain = audio.createGain();
        noise.buffer = buffer;
        noise.loop = true;
        noiseGain.gain.value = 0.012;
        noise.connect(noiseGain);
        connectPanned(audio, noiseGain, noiseFilter, -0.04);
        noise.start();

        state.audio = {
          context: audio,
          lowpass,
          master,
          noiseFilter,
          voices,
          analyser,
          sampleData: new Uint8Array(analyser.fftSize)
        };

        document.documentElement.dataset.audio = state.audioEnabled ? audio.state : "off";
        document.documentElement.dataset.audioContext = audio.state;
        awakenAudio();
        document.addEventListener("visibilitychange", () => {
          const now = state.audio.context.currentTime;
          state.audio.master.gain.cancelScheduledValues(now);
          if (document.hidden) {
            state.audio.master.gain.linearRampToValueAtTime(state.audioEnabled ? 0.04 : 0, now + 1.6);
          } else {
            awakenAudio();
          }
        });
      }

      function awakenAudio() {
        if (!state.audio) {
          return;
        }

        state.audio.context.resume().then(() => {
          const now = state.audio.context.currentTime;
          state.audio.master.gain.cancelScheduledValues(now);
          state.audio.master.gain.setValueAtTime(state.audio.master.gain.value, now);
          state.audio.master.gain.linearRampToValueAtTime(webAudioTargetVolume(), now + (state.audioEnabled ? 0.9 : 0.22));
          document.documentElement.dataset.audio = state.audioEnabled ? "on" : "off";
          document.documentElement.dataset.audioMode = currentAudioMode();
          document.documentElement.dataset.audioContext = state.audio.context.state;
          updateAudioDebug();
        }).catch(() => {
          document.documentElement.dataset.audio = "blocked";
          document.documentElement.dataset.audioContext = state.audio.context.state;
          state.mediaFallbackAudible = true;
          syncMediaVolume();
          updateAudioDebug();
        });
      }

      function bindAudioUnlock() {
        const unlock = () => {
          if (state.audioEnabled) {
            if (shouldPrimeMediaAudio()) {
              startMediaAudio();
            }
            if (!shouldUseMediaOnly()) {
              startAudio();
            }
          }
        };
        window.addEventListener("pointerdown", unlock, { passive: true, capture: true });
        window.addEventListener("touchstart", unlock, { passive: true, capture: true });
        window.addEventListener("touchend", unlock, { passive: true, capture: true });
        window.addEventListener("click", unlock, { passive: true, capture: true });
        window.addEventListener("keydown", unlock, { passive: true });
      }

      function bindBeeInteraction() {
        let lastMouseStartle = 0;
        const canStartle = (event) => !event.target.closest(".chakra-panel, .audio-toggle");

        window.addEventListener("pointerdown", (event) => {
          if (canStartle(event)) {
            startleBee(event.clientX, event.clientY, event.pointerType);
          }
        }, { passive: true });

        window.addEventListener("pointermove", (event) => {
          if (event.pointerType !== "mouse" || !canStartle(event)) {
            return;
          }
          const now = performance.now();
          if (now - lastMouseStartle > 650) {
            startleBee(event.clientX, event.clientY, "mouse");
            lastMouseStartle = now;
          }
        }, { passive: true });
      }

      window.addEventListener("resize", resize, { passive: true });
      window.addEventListener("beforeunload", saveGarden);

      loadGarden();
      if (audioDebugEnabled) {
        document.documentElement.dataset.audioDebug = "true";
        window.setInterval(updateAudioDebug, 700);
      }
      buildChakraButtons();
      bindControls();
      bindPanelControls();
      bindAudioToggle();
      bindAudioUnlock();
      bindBeeInteraction();
      if (GREEN_TEA_URL) {
        els.greenTeaLink.href = GREEN_TEA_URL;
        els.greenTeaLink.removeAttribute("aria-disabled");
        els.greenTeaLink.querySelector("span").textContent = "tip";
      }
      setChakra(0);
      setVolume(52);
      syncAudioToggle();
      syncBreathControls();
      setGratitude(0);
      resize();
      if (shouldPrimeMediaAudio()) {
        const idle = window.requestIdleCallback || ((callback) => window.setTimeout(callback, 250));
        idle(prepareMediaFallback);
      }
      seedGarden();
      setMantra(0);
      animate(performance.now());
      window.setInterval(cycleMantra, 11200);
    })();
  </script>
</body>
</html>
